name: Fix statement print download only

on:
  push:
    paths:
      - '.github/workflows/fix-statement-output.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make only requested output fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'URL.revokeObjecuRL(url)'
          new = 'URL.revokeObjectURL(url)'
          if old not in s:
              raise SystemExit('Expected download cleanup typo was not found; no change made.')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit only requested change and remove workflow
        run: |
          rm -f .github/workflows/fix-statement-output.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@github.com'
          git add index.html .github/workflows/fix-statement-output.yml
          git commit -m 'Keep matched items out of statement and fix statement download' || exit 0
          git push

name: Fix ReconAI timing classification
on:
  push:
    paths:
      - '.github/workflows/fix-recon.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timing logic
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='if(gap===0||bestScore>=85&&gap<=1)matched.push(item);else timing.push(item);'
          new='if(gap===0)matched.push(item);else if(gap<=7&&bestScore>=70)timing.push(item);else { used.delete(best); }'
          if old not in s:
              raise SystemExit('Target code not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'ReconAI Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix timing difference classification' || exit 0
          git push
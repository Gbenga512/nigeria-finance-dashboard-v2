name: Install report download controls

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[report-downloads-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Excel and PDF download modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="report_downloads.js?v=1"></script>',
              '<script src="download_fix.js?v=2"></script>'
          ]
          marker = '</body>'
          if marker not in s:
              raise SystemExit('Could not find </body> in index.html')
          changed = False
          for tag in tags:
              if tag not in s:
                  s = s.replace(marker, tag + '\n' + marker, 1)
                  changed = True
          if changed:
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit installation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install Excel and PDF report downloads [report-downloads-installed]'
          git push

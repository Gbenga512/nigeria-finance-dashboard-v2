name: Inject authoritative reconciliation report

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject authoritative manual report renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script src="report_template\\.js(?:\\?v=[^"]+)?"></script>\s*', '', s)
          s=re.sub(r'<script src="manual_report_v5\\.js(?:\\?v=[^"]+)?"></script>\s*', '', s)
          tag='<script src="manual_report_v5.js?v=5"></script>'
          s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit injected renderer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Use authoritative manual reconciliation statement"
          git push

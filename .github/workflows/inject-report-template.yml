name: Install authoritative reconciliation report renderer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove competing report renderers and install v8
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\s+src=["\']report_template\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', s, flags=re.I)
          s=re.sub(r'<script\s+src=["\']manual_report_v[0-9]+\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', s, flags=re.I)
          tag='<script src="manual_report_v8.js?v=8"></script>\n<script src="manual_report_v8_patch.js?v=8.1"></script>'
          if 'manual_report_v8.js?v=8' not in s:
              s=s.replace('</body>', tag+'\n</body>')
          elif 'manual_report_v8_patch.js?v=8.1' not in s:
              s=s.replace('</body>', '<script src="manual_report_v8_patch.js?v=8.1"></script>\n</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit renderer update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add v8 reconciliation template precision patch"
          git push

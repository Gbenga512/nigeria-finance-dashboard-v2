name: Fix reconciliation report formula

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct report calculation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('report_template.js')
          s=p.read_text(encoding='utf-8')
          old="""const ledgerClosing = closingFromModel(S.lm,ledgerCredits-ledgerDebits);\n    const ledgerOpening = ledgerClosing-ledgerCredits+ledgerDebits;\n    const computedBank = ledgerOpening-ledgerDebits+ledgerCredits + glCredit.reduce((a,x)=>a+x.r.amt,0) - glDebit.reduce((a,x)=>a+Math.abs(x.r.amt),0) + bankCredit.reduce((a,x)=>a+x.r.amt,0) - bankDebit.reduce((a,x)=>a+Math.abs(x.r.amt),0) - chargeValue;"""
          new="""const ledgerClosing = closingFromModel(S.lm,ledgerCredits-ledgerDebits);\n    const ledgerOpening = ledgerClosing-ledgerDebits+ledgerCredits;\n    const glCreditValue=glCredit.reduce((a,x)=>a+x.r.amt,0), glDebitValue=glDebit.reduce((a,x)=>a+Math.abs(x.r.amt),0);\n    const bankCreditValue=bankCredit.filter(x=>!bankCharges.includes(x)).reduce((a,x)=>a+x.r.amt,0), bankDebitValue=bankDebit.filter(x=>!bankCharges.includes(x)).reduce((a,x)=>a+Math.abs(x.r.amt),0);\n    const computedBank = ledgerClosing+glCreditValue+bankCreditValue-glDebitValue-bankDebitValue-chargeValue;"""
          if old in s:
              p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Commit formula fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report_template.js
          git diff --cached --quiet && exit 0
          git commit -m "Align reconciliation statement calculation with template"
          git push

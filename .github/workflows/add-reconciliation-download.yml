name: Add reconciliation sheet download

"on":
  push:
    paths:
      - '.github/workflows/add-reconciliation-download.yml'

permissions:
  contents: write

jobs:
  add-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add standalone reconciliation sheet download
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          button = '<button id="downloadBtn" class="btn secondary">Download reconciliation sheet</button>'
          anchor = '<button id="printBtn" class="btn success">Print / Save as PDF</button>'
          if 'id="downloadBtn"' not in s:
              if anchor not in s:
                  raise SystemExit('Print button anchor not found')
              s = s.replace(anchor, anchor + button, 1)
          js = '''
<script>
(function(){
  function downloadSheet(){
    const report=document.getElementById('report');
    if(!report || !report.innerHTML.trim()){
      alert('Please complete the reconciliation first.');
      return;
    }
    const title=(document.title||'Bank Reconciliation Statement').replace(/[^a-z0-9_-]+/gi,'-');
    const css=`body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#111;margin:0;padding:24px}.working{background:#fff;color:#111;max-width:1000px;margin:auto;padding:25px}.working .title{text-align:center;border-bottom:2px solid #333;padding-bottom:10px;margin-bottom:12px}.working .title h1{font-size:19px;margin:0}.working .title h2{font-size:14px;margin:5px 0}.working table{width:100%;border-collapse:collapse;min-width:0}.working th,.working td{border:1px solid #555;padding:5px 6px;font-size:10.5px}.working th{background:#ddd}.working .barhead{background:#666;color:#fff;font-weight:700}.working .shade{background:#ddd;font-weight:700}.working .total{font-weight:700;background:#eee}.working .amount{text-align:right;white-space:nowrap}.working .memo{font-size:10.5px;font-style:italic;margin:8px 0}.working .variance{font-weight:800}`;
    const html='<!doctype html><html><head><meta charset="utf-8"><title>'+title+'</title><style>'+css+'</style></head><body>'+report.innerHTML+'</body></html>';
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=title+'-reconciliation.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  }
  document.addEventListener('click',function(e){
    if(e.target && e.target.id==='downloadBtn') downloadSheet();
  });
})();
</script>
'''
          if 'function downloadSheet' not in s:
              s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change and remove one-time workflow
        run: |
          rm -f .github/workflows/add-reconciliation-download.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-reconciliation-download.yml
          git commit -m 'Add reconciliation sheet download' || exit 0
          git push

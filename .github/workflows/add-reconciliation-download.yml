name: Reconciliation download fix

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add download button and handler
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          anchor = '<button id="printBtn" class="btn success">Print / Save as PDF</button>'
          button = '<button id="downloadBtn" class="btn secondary">Download reconciliation sheet</button>'
          if 'id="downloadBtn"' not in s:
              if anchor not in s:
                  raise SystemExit('Print button anchor not found')
              s = s.replace(anchor, anchor + button, 1)
          payload = ''
          js = base64.b64decode(payload).decode()
          if 'function downloadSheet' not in s:
              s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/add-reconciliation-download.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/add-reconciliation-download.yml
          git commit -m 'Add reconciliation sheet download' || exit 0
          git push
